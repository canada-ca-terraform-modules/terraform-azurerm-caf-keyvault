name: Verify live-test OIDC auth

# One-off verification for ticket 09 (OIDC & sandbox Azure auth wiring):
# confirms the live-test Environment's federated credential can authenticate
# and reach the sandbox resource group. Superseded by the full live-test
# pipeline once ticket 12 lands.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: live-test
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: List sandbox resource group resources
        run: az resource list --resource-group rg-live-test-keyvault-sandbox -o table
